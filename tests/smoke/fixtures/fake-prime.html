<html><head><meta charset="utf-8"><title>Fake Prime Video</title>

  video{width:100%;height:100%;display:block;background:#111}

</head>
<body>
  <main>
    <div id="dv-web-player" data-testid="web-player">
      <video src=""></video>

    const v = document.querySelector('video')
