<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fake Prime Video</title>
    <style>
      body {
        margin: 0;
        background: #05070a;
        color: white;
      }
      #dv-web-player {
        position: relative;
        width: 1000px;
        height: 600px;
        background: #111;
        margin: 24px auto;
        display: grid;
        place-items: center;
      }
      video {
        width: 900px;
        height: 506px;
        display: block;
        background: #050505;
      }
      .atvwebplayersdk-captions-overlay {
        position: absolute;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
      }
      #native-caption:empty {
        display: none;
      }
      #subtitle-menu[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="dv-web-player" data-testid="web-player">
        <video
          src=""
          data-dual-subs-duration="1470.976"
          data-dual-subs-ready-state="4"
        ></video>
        <div class="atvwebplayersdk-captions-overlay">
          <span id="native-caption"></span>
        </div>
        <button
          type="button"
          class="atvwebplayersdk-subtitleaudiomenu-button"
          aria-label="Subtitles and Audio Menu"
        >
          Subtitles
        </button>
        <div id="subtitle-menu" hidden>
          <label>
            <input type="radio" name="subtitle" id="off" checked /> Off
          </label>
          <label>
            <input type="radio" name="subtitle" id="en-us_Subtitle_Dialog_1" />
            English
          </label>
          <label>
            <input
              type="radio"
              name="subtitle"
              id="zh-hant_Subtitle_Dialog_2"
            />
            Chinese Traditional
          </label>
        </div>
      </div>
    </main>
    <script>
      const titleId =
        location.pathname.split("/").filter(Boolean).pop() || "prime-fixture";
      const v = document.querySelector("video");
      window.__setTime = (t) => {
        v.currentTime = t;
      };
      const subtitleMenu = document.querySelector("#subtitle-menu");
      document
        .querySelector(".atvwebplayersdk-subtitleaudiomenu-button")
        .addEventListener("click", () => {
          subtitleMenu.hidden = !subtitleMenu.hidden;
        });
      document.querySelectorAll('input[name="subtitle"]').forEach((input) => {
        input.addEventListener("change", () => {
          document.querySelector("#native-caption").textContent =
            input.id === "off" ? "" : `Native ${input.id.split("_")[0]}`;
          subtitleMenu.hidden = true;
        });
      });
      fetch(
        "/playback/GetPlaybackResources?titleId=" +
          encodeURIComponent(titleId) +
          "&desiredResources=SubtitleUrls,SubtitleMetadata",
      ).catch(() => {});
    </script>
  </body>
</html>
