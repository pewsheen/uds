<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Anchor Glow Mockup — Dock to video</title>
<style>
  @property --angle { syntax:'<angle>'; initial-value:0deg; inherits:false; }
  :root{
    --ai1:#ff3b6b; --ai2:#ff8a3d; --ai3:#ffd23d; --ai4:#3ddc84;
    --ai5:#22d3ee; --ai6:#3b82f6; --ai7:#8b5cf6; --ai8:#ec4899;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI','Microsoft JhengHei',system-ui,sans-serif;
    background:#0f0f0f;color:#f1f1f1;min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;padding:38px 24px 70px;
  }
  .page{width:1120px;}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;opacity:.9;}
  .logo{font-weight:700;font-size:20px;letter-spacing:-.5px;}
  .logo span{color:#ff4e45;}
  .search{flex:1;max-width:460px;height:34px;border-radius:18px;background:#222;border:1px solid #333;}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:28px;}

  .player-wrap{position:relative;border-radius:14px;}
  .halo,.ring{position:absolute;border-radius:16px;pointer-events:none;}
  .halo{
    inset:-16px;
    background:conic-gradient(from var(--angle),
      var(--ai1),var(--ai2),var(--ai3),var(--ai4),var(--ai5),var(--ai6),var(--ai7),var(--ai8),var(--ai1));
    filter:blur(26px) saturate(1.4) brightness(1.12);opacity:.95;
    animation:spin 6s linear infinite, breathe 3.4s ease-in-out infinite;
  }
  .ring{
    inset:-3px;padding:3px;
    background:conic-gradient(from var(--angle),
      var(--ai1),var(--ai2),var(--ai3),var(--ai4),var(--ai5),var(--ai6),var(--ai7),var(--ai8),var(--ai1));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    filter:saturate(1.35);animation:spin 6s linear infinite;
  }
  @keyframes spin{ to{ --angle:360deg; } }
  @keyframes breathe{ 0%,100%{opacity:.78;} 50%{opacity:1;} }

  .player{
    position:relative;z-index:2;aspect-ratio:16/9;border-radius:13px;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 30%, #2b3a4a 0%, #141a22 60%, #0c1116 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.16;}
  .play div{width:0;height:0;border-left:46px solid #fff;border-top:28px solid transparent;border-bottom:28px solid transparent;margin-left:10px;}
  .ctrl{position:absolute;left:0;right:0;bottom:0;height:48px;background:linear-gradient(transparent,rgba(0,0,0,.72));}
  .ctrl::before{content:"";position:absolute;left:14px;right:14px;bottom:30px;height:3px;border-radius:2px;background:rgba(255,255,255,.3);}
  .ctrl::after{content:"";position:absolute;left:14px;bottom:29px;width:38%;height:5px;border-radius:3px;background:#ff4e45;}

  .subs{
    position:absolute;left:50%;bottom:66px;transform:translateX(-50%) scale(1.05) rotate(-.5deg);
    z-index:5;display:flex;flex-direction:column;gap:6px;align-items:center;
    padding:13px 20px;border-radius:12px;max-width:80%;
    background:rgba(10,10,12,.6);backdrop-filter:blur(3px);cursor:grabbing;
    box-shadow:0 20px 44px rgba(0,0,0,.6), 0 0 0 1.5px rgba(255,255,255,.18);
  }
  .subs .l1{font-size:25px;font-weight:600;color:#fff;text-shadow:0 2px 7px rgba(0,0,0,.85);}
  .subs .l2{font-size:25px;font-weight:600;color:#ffe7a3;text-shadow:0 2px 7px rgba(0,0,0,.85);}
  .grip{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);}

  .badge{
    position:absolute;left:50%;bottom:158px;transform:translateX(-50%);z-index:6;
    display:flex;align-items:center;gap:9px;padding:8px 15px;border-radius:20px;
    font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;
    background:linear-gradient(90deg, rgba(59,130,246,.96), rgba(139,92,246,.96));
    box-shadow:0 10px 26px rgba(80,60,200,.55), 0 0 0 1px rgba(255,255,255,.28);
  }
  .badge .dot{width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;position:relative;}
  .badge .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff;}

  .cursor{position:absolute;left:calc(50% + 96px);bottom:74px;z-index:7;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));}

  .title{margin-top:18px;font-size:20px;font-weight:700;}
  .meta{margin-top:6px;font-size:13px;color:#aaa;}
  .comments{margin-top:22px;display:flex;flex-direction:column;gap:16px;}
  .cm{display:flex;gap:12px;}
  .av{width:36px;height:36px;border-radius:50%;background:#333;flex:none;}
  .cmlines{flex:1;display:flex;flex-direction:column;gap:7px;}
  .cmlines i{display:block;height:9px;border-radius:5px;background:#262626;}
  .cmlines i:first-child{width:28%;height:11px;background:#2f2f2f;}
  .cmlines i:nth-child(3){width:82%;}
  .cmlines i:nth-child(4){width:54%;}

  .side{display:flex;flex-direction:column;gap:14px;}
  .rec{display:flex;gap:10px;}
  .thumb{width:120px;height:68px;border-radius:8px;background:#1e1e1e;flex:none;}
  .rl{flex:1;display:flex;flex-direction:column;gap:7px;}
  .rl i{height:9px;border-radius:5px;background:#262626;}
  .rl i:first-child{width:92%;height:11px;background:#2f2f2f;}
  .rl i:nth-child(2){width:60%;}
  .rl i:nth-child(3){width:40%;}

  .legend{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    background:rgba(20,20,24,.92);border:1px solid #333;border-radius:10px;
    padding:10px 18px;font-size:13px;color:#d2d2d2;display:flex;gap:20px;align-items:center;}
  .legend b{color:#fff;}
  .sw{display:inline-block;width:36px;height:10px;border-radius:5px;vertical-align:middle;margin-right:7px;
    background:conic-gradient(var(--ai1),var(--ai3),var(--ai4),var(--ai5),var(--ai6),var(--ai7),var(--ai1));}
</style>
</head>
<body>
  <div class="page">
    <div class="topbar"><div class="logo">Dual<span>Subs</span> ▸ YouTube</div><div class="search"></div></div>
    <div class="layout">
      <div class="main">
        <div class="player-wrap">
          <div class="halo"></div>
          <div class="ring"></div>
          <div class="player">
            <div class="play"><div></div></div>
            <div class="ctrl"></div>
            <div class="badge"><span class="dot"></span>錨定影片 · Dock to video</div>
            <div class="subs">
              <div class="grip"></div>
              <div class="l1">I think the key is to keep iterating.</div>
              <div class="l2">我認為關鍵是不斷地迭代。</div>
            </div>
            <svg class="cursor" width="28" height="28" viewBox="0 0 24 24">
              <path d="M4 2 L4 22 L9.4 16.6 L12.6 22.6 L15.3 21.2 L12.1 15.3 L19 15.3 Z"
                    fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="title">如何用測試駕馭 AI 寫出可靠的瀏覽器擴充功能</div>
        <div class="meta">128K views · 拖曳字幕時,player 邊框亮起流動彩色光暈,表示「放開將錨定到影片」</div>
        <div class="comments">
          <div class="cm"><div class="av"></div><div class="cmlines"><i></i><i></i><i></i><i></i></div></div>
          <div class="cm"><div class="av"></div><div class="cmlines"><i></i><i></i><i></i></div></div>
        </div>
      </div>
      <div class="side">
        <div class="rec"><div class="thumb"></div><div class="rl"><i></i><i></i><i></i></div></div>
        <div class="rec"><div class="thumb"></div><div class="rl"><i></i><i></i><i></i></div></div>
        <div class="rec"><div class="thumb"></div><div class="rl"><i></i><i></i><i></i></div></div>
        <div class="rec"><div class="thumb"></div><div class="rl"><i></i><i></i><i></i></div></div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span><span class="sw"></span><b>錨定影片狀態</b>:player 邊框類 Apple Intelligence 彩色發光</span>
    <span>放開即停靠,字幕隨影片捲動(不擋留言)</span>
  </div>
</body>
</html>
