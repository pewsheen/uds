<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Anchor Glow v3 — viewport inner glow (Float on screen)</title>
<style>
  @property --angle { syntax:'<angle>'; initial-value:0deg; inherits:false; }
  :root{
    --ai1:#ff3b6b; --ai2:#ff8a3d; --ai3:#ffd23d; --ai4:#3ddc84;
    --ai5:#22d3ee; --ai6:#3b82f6; --ai7:#8b5cf6; --ai8:#ec4899;
    --accentA:#a78bfa; --accentB:#3b82f6; --accentC:#22d3ee;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI','Microsoft JhengHei',system-ui,sans-serif;
    background:#0c0c0d;color:#f1f1f1;overflow:hidden;
  }

  /* ===== viewport INNER glow (anchor = viewport) ===== */
  /* full-edge subtle rainbow, glowing inward — visible even though anchor is the whole screen */
  .vp-glow{
    position:fixed; inset:0; pointer-events:none; z-index:40;
    background:conic-gradient(from var(--angle),
      var(--ai1),var(--ai2),var(--ai3),var(--ai4),var(--ai5),var(--ai6),var(--ai7),var(--ai8),var(--ai1));
    -webkit-mask:radial-gradient(135% 125% at 50% 50%, transparent 56%, #000 86%);
    mask:radial-gradient(135% 125% at 50% 50%, transparent 56%, #000 86%);
    filter:blur(16px) saturate(1.2); opacity:.5;
    animation:spin 8s linear infinite;
  }
  /* emphasized edge (the pinned edge = where it attaches / grows away from) — here: BOTTOM */
  .vp-edge{
    position:fixed; left:0; right:0; bottom:0; height:190px; pointer-events:none; z-index:41;
    background:linear-gradient(to top, rgba(124,92,246,.55), rgba(34,211,238,.22) 42%, transparent 82%);
    filter:blur(2px); animation:pulse 3s ease-in-out infinite;
  }
  .vp-edge-line{
    position:fixed; left:0; right:0; bottom:0; height:3px; pointer-events:none; z-index:42;
    background:linear-gradient(90deg,transparent,var(--accentA),var(--accentB),var(--accentC),var(--accentA),transparent);
    box-shadow:0 0 16px rgba(99,102,241,.95),0 0 34px rgba(34,211,238,.55);
  }
  @keyframes spin{ to{ --angle:360deg; } }
  @keyframes pulse{ 0%,100%{opacity:.8;} 50%{opacity:1;} }

  .page{position:relative;z-index:10;height:100%;padding:26px 34px;}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;opacity:.9;}
  .logo{font-weight:700;font-size:19px;letter-spacing:-.5px;}
  .logo span{color:#ff4e45;}
  .search{flex:1;max-width:430px;height:32px;border-radius:18px;background:#202020;border:1px solid #303030;}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:26px;}

  /* player here is NOT the anchor → plain, no glow */
  .player{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 30%, #2b3a4a 0%, #141a22 60%, #0c1116 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.13;}
  .play div{width:0;height:0;border-left:40px solid #fff;border-top:25px solid transparent;border-bottom:25px solid transparent;margin-left:9px;}
  .ctrl{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,rgba(0,0,0,.7));}
  .ctrl::after{content:"";position:absolute;left:14px;bottom:24px;width:38%;height:4px;border-radius:3px;background:#ff4e45;}
  .title{margin-top:16px;font-size:18px;font-weight:700;}
  .meta{margin-top:6px;font-size:12.5px;color:#9a9a9a;}
  .comments{margin-top:18px;display:flex;flex-direction:column;gap:14px;}
  .cm{display:flex;gap:11px;}
  .av{width:34px;height:34px;border-radius:50%;background:#2c2c2c;flex:none;}
  .cmlines{flex:1;display:flex;flex-direction:column;gap:6px;}
  .cmlines i{display:block;height:8px;border-radius:5px;background:#222;}
  .cmlines i:first-child{width:26%;height:10px;background:#2c2c2c;}
  .cmlines i:nth-child(3){width:78%;}
  .side{display:flex;flex-direction:column;gap:13px;}
  .rec{display:flex;gap:10px;}
  .thumb{width:112px;height:64px;border-radius:8px;background:#1c1c1c;flex:none;}
  .rl{flex:1;display:flex;flex-direction:column;gap:6px;}
  .rl i{height:8px;border-radius:5px;background:#222;}
  .rl i:first-child{width:90%;height:10px;background:#2c2c2c;}
  .rl i:nth-child(2){width:58%;}

  /* floating subtitle — pinned to viewport, near bottom → grows up */
  .subs{
    position:fixed;left:50%;bottom:54px;transform:translateX(-50%) scale(1.04) rotate(-.4deg);
    z-index:60;display:flex;flex-direction:column;gap:5px;align-items:center;
    padding:11px 18px;border-radius:12px;max-width:60%;
    background:rgba(10,10,12,.62);backdrop-filter:blur(3px);cursor:grabbing;
    box-shadow:0 18px 40px rgba(0,0,0,.6), 0 0 0 1.5px rgba(255,255,255,.18);
  }
  .subs .l1{font-size:23px;font-weight:600;color:#fff;text-shadow:0 2px 7px rgba(0,0,0,.85);}
  .subs .l2{font-size:23px;font-weight:600;color:#ffe7a3;text-shadow:0 2px 7px rgba(0,0,0,.85);}
  .grip{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);}
  .badge{
    position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:61;
    display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:20px;
    font-size:14px;font-weight:600;color:#fff;white-space:nowrap;
    background:linear-gradient(90deg, rgba(34,211,238,.95), rgba(59,130,246,.96));
    box-shadow:0 10px 26px rgba(40,120,200,.55), 0 0 0 1px rgba(255,255,255,.28);
  }
  .cursor{position:fixed;left:calc(50% + 150px);bottom:64px;z-index:62;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));}

  .note{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:63;
    background:rgba(18,18,22,.92);border:1px solid #333;border-radius:10px;
    padding:8px 16px;font-size:13px;color:#dcdcdc;}
  .note b{color:#fff;}
</style>
</head>
<body>
  <div class="vp-glow"></div>
  <div class="vp-edge"></div>
  <div class="vp-edge-line"></div>

  <div class="page">
    <div class="topbar"><div class="logo">Dual<span>Subs</span> ▸ YouTube</div><div class="search"></div></div>
    <div class="layout">
      <div class="main">
        <div class="player">
          <div class="play"><div></div></div><div class="ctrl"></div>
        </div>
        <div class="title">浮動畫面模式:字幕釘在 viewport,不隨頁面捲動</div>
        <div class="meta">anchor = viewport → 高亮用「內側發光」,因為外暈會跑到螢幕外看不到</div>
        <div class="comments">
          <div class="cm"><div class="av"></div><div class="cmlines"><i></i><i></i><i></i></div></div>
          <div class="cm"><div class="av"></div><div class="cmlines"><i></i><i></i></div></div>
        </div>
      </div>
      <div class="side">
        <div class="rec"><div class="thumb"></div><div class="rl"><i></i><i></i></div></div>
        <div class="rec"><div class="thumb"></div><div class="rl"><i></i><i></i></div></div>
        <div class="rec"><div class="thumb"></div><div class="rl"><i></i><i></i></div></div>
      </div>
    </div>
  </div>

  <div class="note"><b>浮動畫面 (anchor = viewport)</b> · 整個螢幕邊緣內側發光,下緣加強 = 釘下緣、往上長</div>
  <div class="badge">◎ 浮動畫面 · Float on screen · 釘下緣</div>
  <div class="subs"><div class="grip"></div>
    <div class="l1">Pinned to the screen.</div>
    <div class="l2">字幕釘在畫面上。</div>
  </div>
  <svg class="cursor" width="28" height="28" viewBox="0 0 24 24"><path d="M4 2 L4 22 L9.4 16.6 L12.6 22.6 L15.3 21.2 L12.1 15.3 L19 15.3 Z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>
</body>
</html>
