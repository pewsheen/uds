<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="uds.css" />
    <title>UDS Control</title>
  </head>
  <body>
    <div class="hazard-rail" aria-hidden="true"></div>

    <header class="panel-header">
      <div class="brand-lockup">
        <span class="brand-word">UDS<span>//</span></span>
        <span class="brand-kicker">// CAPTION CONTROL</span>
      </div>
      <span class="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text"></span>
      </span>
    </header>

    <main>
      <section class="master-panel" aria-labelledby="system-label">
        <div class="section-id" id="system-label">SYS.00 // MASTER LINK</div>
        <label class="switch">
          <span class="switch-copy">
            <span class="switch-title">Dual subtitles</span>
            <span class="switch-meta">Overlay transmission</span>
          </span>
          <input
            type="checkbox"
            id="enabled"
            class="visually-hidden"
            role="switch"
          />
          <span class="switch-track" aria-hidden="true"></span>
        </label>
        <label class="check native-option">
          <input type="checkbox" id="native" class="visually-hidden" />
          <span class="check-box" aria-hidden="true"></span>
          <span class="check-text">Show original subtitles</span>
        </label>
      </section>

      <div class="feeds" aria-label="Subtitle channels">
        <section class="channel">
          <div class="channel-header">
            <div>
              <span class="channel-index">FEED 01</span>
              <span class="channel-name">PRIMARY CHANNEL</span>
            </div>
            <span class="channel-status" aria-hidden="true">
              <span class="channel-state"></span>
              <span class="channel-dot"></span>
            </span>
          </div>

          <div class="field select-wrap">
            <label for="lang0">Source</label>
            <select id="lang0" class="control"></select>
          </div>

          <div class="grid-two">
            <div class="field">
              <label for="color0">Text signal</label>
              <input type="color" id="color0" />
            </div>
            <div class="field">
              <label for="bgColor0">Backdrop</label>
              <input type="color" id="bgColor0" />
            </div>
          </div>

          <div class="field">
            <span class="label-row">
              <label for="bgOpacity0">Backdrop opacity</label>
              <b id="bgOpacityVal0"></b>
            </span>
            <input type="range" id="bgOpacity0" min="0" max="100" />
          </div>

          <div class="grid-two channel-footer">
            <div class="field">
              <label for="size0">Type scale</label>
              <span class="number-wrap">
                <input
                  type="number"
                  id="size0"
                  min="10"
                  max="80"
                  class="control"
                />
                <span class="unit">PX</span>
              </span>
            </div>
            <label class="check outline-option">
              <input type="checkbox" id="outline0" class="visually-hidden" />
              <span class="check-box" aria-hidden="true"></span>
              <span class="check-text">Outline</span>
            </label>
          </div>
        </section>

        <section class="channel">
          <div class="channel-header">
            <div>
              <span class="channel-index">FEED 02</span>
              <span class="channel-name">SECONDARY CHANNEL</span>
            </div>
            <span class="channel-status" aria-hidden="true">
              <span class="channel-state"></span>
              <span class="channel-dot"></span>
            </span>
          </div>

          <div class="field select-wrap">
            <label for="lang1">Source</label>
            <select id="lang1" class="control"></select>
          </div>

          <div class="grid-two">
            <div class="field">
              <label for="color1">Text signal</label>
              <input type="color" id="color1" />
            </div>
            <div class="field">
              <label for="bgColor1">Backdrop</label>
              <input type="color" id="bgColor1" />
            </div>
          </div>

          <div class="field">
            <span class="label-row">
              <label for="bgOpacity1">Backdrop opacity</label>
              <b id="bgOpacityVal1"></b>
            </span>
            <input type="range" id="bgOpacity1" min="0" max="100" />
          </div>

          <div class="grid-two channel-footer">
            <div class="field">
              <label for="size1">Type scale</label>
              <span class="number-wrap">
                <input
                  type="number"
                  id="size1"
                  min="10"
                  max="80"
                  class="control"
                />
                <span class="unit">PX</span>
              </span>
            </div>
            <label class="check outline-option">
              <input type="checkbox" id="outline1" class="visually-hidden" />
              <span class="check-box" aria-hidden="true"></span>
              <span class="check-text">Outline</span>
            </label>
          </div>
        </section>
      </div>
    </main>

    <footer class="panel-footer">
      <span class="footer-label">// SIGNAL</span>
      <p id="hint"></p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
